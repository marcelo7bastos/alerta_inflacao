name: Coleta de teste do Alerta Inflação

on: workflow_dispatch

permissions:
  contents: read

jobs:
  coleta-teste:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependências da coleta
        run: python -m pip install pandas==2.2.3 requests==2.32.3 python-dateutil==2.9.0.post0 openai==1.69.0
      - name: Executar testes
        run: python -m unittest discover -s tests
      - name: Coletar notícias para conferência
        run: python -m backend.coleta_teste --saida saida-coleta
      - name: Disponibilizar CSV e resumo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coleta-teste
          path: saida-coleta/
          retention-days: 7
          if-no-files-found: warn
